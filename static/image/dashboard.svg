<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif">
  <rect width="960" height="560" fill="#0a0e17"/>
  <rect width="960" height="60" fill="#0d1321"/>
  <text x="28" y="37" fill="#e8edf5" font-size="19" font-weight="600">&#127981; Plastic Mold Factory &#183; Capacity &amp; Efficiency Analysis</text>
  <text x="28" y="55" fill="#5a7a9a" font-size="12">Data Modeling &#8594; Capacity Forecast &#8594; Scheduling &#8594; Economic Analysis &#8594; Visualization</text>

  <!-- KPI cards -->
  <g>
    <rect x="28" y="82" width="215" height="88" rx="12" fill="#111827" stroke="#1a2d44"/>
    <text x="46" y="108" fill="#5a7a9a" font-size="12">Total Machines</text>
    <text x="46" y="142" fill="#e8edf5" font-size="27" font-weight="700">24</text>
    <rect x="46" y="152" width="54" height="17" rx="8" fill="rgba(0,212,255,0.12)"/>
    <text x="73" y="164" fill="#00d4ff" font-size="11" text-anchor="middle">Online</text>
  </g>
  <g>
    <rect x="255" y="82" width="215" height="88" rx="12" fill="#111827" stroke="#1a2d44"/>
    <text x="273" y="108" fill="#5a7a9a" font-size="12">Avg Load Rate</text>
    <text x="273" y="142" fill="#e8edf5" font-size="27" font-weight="700">68.4<tspan font-size="13" fill="#5a7a9a">%</tspan></text>
    <rect x="273" y="152" width="70" height="17" rx="8" fill="rgba(0,212,255,0.12)"/>
    <text x="308" y="164" fill="#00d4ff" font-size="11" text-anchor="middle">Normal</text>
  </g>
  <g>
    <rect x="482" y="82" width="215" height="88" rx="12" fill="#111827" stroke="#1a2d44"/>
    <text x="500" y="108" fill="#5a7a9a" font-size="12">Order Delay Rate</text>
    <text x="500" y="142" fill="#e8edf5" font-size="27" font-weight="700">12.5<tspan font-size="13" fill="#5a7a9a">%</tspan></text>
    <rect x="500" y="152" width="78" height="17" rx="8" fill="rgba(255,107,107,0.12)"/>
    <text x="539" y="164" fill="#ff6b6b" font-size="11" text-anchor="middle">Attention</text>
  </g>
  <g>
    <rect x="709" y="82" width="223" height="88" rx="12" fill="#111827" stroke="#1a2d44"/>
    <text x="727" y="108" fill="#5a7a9a" font-size="12">Monthly Profit</text>
    <text x="727" y="142" fill="#e8edf5" font-size="27" font-weight="700">&#165; 486k</text>
    <rect x="727" y="152" width="60" height="17" rx="8" fill="rgba(0,212,255,0.12)"/>
    <text x="757" y="164" fill="#00d4ff" font-size="11" text-anchor="middle">Profit</text>
  </g>

  <!-- Left: line chart -->
  <g>
    <rect x="28" y="190" width="448" height="340" rx="12" fill="#0d1b2a" stroke="#1a2d44"/>
    <text x="48" y="216" fill="#c8d6e5" font-size="14" font-weight="600">&#128200; 7-Day Equipment Load Trend</text>
    <polyline points="48,300 90,286 132,292 174,268 216,276 258,250 300,258 342,236 384,244 420,222"
              fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="48,322 90,286 132,292 174,268 216,276 258,250 300,258 342,236 384,244 420,222 420,322"
             fill="rgba(0,212,255,0.12)"/>
    <line x1="48" y1="322" x2="420" y2="322" stroke="#1a2d44" stroke-width="1"/>
    <text x="48" y="340" fill="#5a7a9a" font-size="10">Mon</text>
    <text x="110" y="340" fill="#5a7a9a" font-size="10">Tue</text>
    <text x="172" y="340" fill="#5a7a9a" font-size="10">Wed</text>
    <text x="234" y="340" fill="#5a7a9a" font-size="10">Thu</text>
    <text x="296" y="340" fill="#5a7a9a" font-size="10">Fri</text>
    <text x="358" y="340" fill="#5a7a9a" font-size="10">Sat</text>
    <text x="408" y="340" fill="#5a7a9a" font-size="10">Sun</text>
  </g>

  <!-- Right: bar chart -->
  <g>
    <rect x="492" y="190" width="440" height="340" rx="12" fill="#0d1b2a" stroke="#1a2d44"/>
    <text x="512" y="216" fill="#c8d6e5" font-size="14" font-weight="600">&#128295; Load by Machine Type</text>
    <text x="512" y="238" fill="#5a7a9a" font-size="11">Mean / Peak load (%)</text>
    <g fill="#00d4ff">
      <rect x="540" y="430" width="26" height="0" />
      <rect x="540" y="370" width="26" height="60" rx="3" />
      <rect x="600" y="330" width="26" height="100" rx="3" />
      <rect x="660" y="300" width="26" height="130" rx="3" />
      <rect x="720" y="280" width="26" height="150" rx="3" />
      <rect x="780" y="340" width="26" height="90" rx="3" />
      <rect x="840" y="380" width="26" height="50" rx="3" />
    </g>
    <g fill="#ffc107">
      <rect x="568" y="350" width="26" height="80" rx="3" />
      <rect x="628" y="305" width="26" height="125" rx="3" />
      <rect x="688" y="265" width="26" height="165" rx="3" />
      <rect x="748" y="250" width="26" height="180" rx="3" />
      <rect x="808" y="315" width="26" height="115" rx="3" />
      <rect x="868" y="360" width="26" height="70" rx="3" />
    </g>
    <line x1="512" y1="430" x2="900" y2="430" stroke="#1a2d44" stroke-width="1"/>
    <circle cx="550" cy="452" r="4" fill="#00d4ff"/>
    <text x="560" y="456" fill="#5a7a9a" font-size="11">Mean Load</text>
    <circle cx="650" cy="452" r="4" fill="#ffc107"/>
    <text x="660" y="456" fill="#5a7a9a" font-size="11">Peak Load</text>
  </g>
</svg>
