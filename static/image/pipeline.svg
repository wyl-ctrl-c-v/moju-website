    <text x="660" y="86" fill="#5a7a9a" font-size="10" text-anchor="middle">heuristic algorithm</text>
  </g>

  <g>
    <rect x="760" y="40" width="160" height="64" rx="10" fill="#111827" stroke="#1a2d44" stroke-width="1.5"/>
    <text x="840" y="66" fill="#e8edf5" font-size="13" font-weight="600" text-anchor="middle">Economic Analysis</text>
    <text x="840" y="86" fill="#5a7a9a" font-size="10" text-anchor="middle">cost quantification</text>
  </g>

  <line x1="202" y1="72" x2="216" y2="72" stroke="#5a7a9a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="382" y1="72" x2="396" y2="72" stroke="#5a7a9a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562" y1="72" x2="576" y2="72" stroke="#5a7a9a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="742" y1="72" x2="756" y2="72" stroke="#5a7a9a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="150" width="620" height="64" rx="10" fill="#111827" stroke="#1a2d44" stroke-width="1.5"/>
  <text x="530" y="176" fill="#e8edf5" font-size="13" font-weight="600" text-anchor="middle">Visualization Dashboard (ECharts)</text>
  <text x="530" y="196" fill="#5a7a9a" font-size="10" text-anchor="middle">Dashboard &#183; Forecasting &#183; Scheduling &#183; Economics &#183; Equipment &#183; Upload</text>

  <line x1="480" y1="104" x2="480" y2="144" stroke="#5a7a9a" stroke-width="2" marker-end="url(#arrow)"/>

