  <text x="530" y="272" fill="#5a7a9a" font-size="11" text-anchor="middle">CSV upload &#8594; automatic model retraining</text>
  <line x1="530" y1="214" x2="530" y2="246" stroke="#5a7a9a" stroke-width="2" marker-end="url(#arrow)"/>
