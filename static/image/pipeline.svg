<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a7a9a"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="12" fill="#0d1b2a"/>

  <g>
    <rect x="40" y="40" width="160" height="64" rx="10" fill="#111827" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="120" y="66" fill="#e8edf5" font-size="13" font-weight="600" text-anchor="middle">Data Collection</text>
    <text x="120" y="86" fill="#5a7a9a" font-size="10" text-anchor="middle">equipment &#183; orders &#183; process</text>
  </g>

  <g>
