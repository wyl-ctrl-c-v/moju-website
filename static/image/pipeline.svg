    <text x="480" y="86" fill="#5a7a9a" font-size="10" text-anchor="middle">scikit-learn model</text>
  </g>

  <g>
    <rect x="580" y="40" width="160" height="64" rx="10" fill="#111827" stroke="#1a2d44" stroke-width="1.5"/>
