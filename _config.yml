# ============================================================
# Project website (Jekyll) configuration
# A single-page project site, deployable to GitHub Pages.
# ============================================================

title: "Plastic Mold Factory: Capacity-Load Forecasting & Economic Analysis System"
description: "Data modeling → capacity forecasting → scheduling optimization → economic analysis → visualization dashboard"

# Deployment location (important):
#   - For a user site (username.github.io), keep baseurl: ""
#   - For a project site (username.github.io/repo-name), set baseurl to "/repo-name"
# The page uses relative image paths, so in most cases it works even without baseurl.
baseurl: ""
url: ""

# Markdown parser and syntax highlighter
markdown: kramdown
highlighter: rouge

# Files/directories excluded from the site build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
